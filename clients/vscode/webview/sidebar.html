<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
  <title>OpenCodex</title>
  <style>
    :root {
      --ocx-bg: var(--vscode-sideBar-background);
      --ocx-fg: var(--vscode-foreground);
      --ocx-border: var(--vscode-sideBar-border, var(--vscode-panel-border));
      --ocx-dim: var(--vscode-descriptionForeground);
      --ocx-link: var(--vscode-textLink-foreground);
      --ocx-hover: var(--vscode-list-hoverBackground);
      --ocx-active: var(--vscode-list-activeSelectionBackground);
      --ocx-active-fg: var(--vscode-list-activeSelectionForeground);
      --ocx-btn-bg: var(--vscode-button-background);
      --ocx-btn-fg: var(--vscode-button-foreground);
      --ocx-btn-hover: var(--vscode-button-hoverBackground);
      --ocx-btn-sec-bg: var(--vscode-button-secondaryBackground);
      --ocx-btn-sec-fg: var(--vscode-button-secondaryForeground);
      --ocx-btn-sec-hover: var(--vscode-button-secondaryHoverBackground);
      --ocx-input-bg: var(--vscode-input-background);
      --ocx-input-fg: var(--vscode-input-foreground);
      --ocx-input-border: var(--vscode-input-border);
      --ocx-warn: var(--vscode-inputValidation-warningBorder, #cca700);
      --ocx-err: var(--vscode-errorForeground);
      --ocx-success: var(--vscode-testing-iconPassed, #73c991);
      --ocx-tool-bg: var(--vscode-editor-inactiveSelectionBackground, #3a3d41);
      --ocx-code-bg: var(--vscode-textCodeBlock-background, #1e1e1e);
      --ocx-chip-bg: var(--vscode-badge-background);
      --ocx-chip-fg: var(--vscode-badge-foreground);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size, 13px);
      color: var(--ocx-fg);
      background: var(--ocx-bg);
      display: flex; flex-direction: column; height: 100vh;
      overflow: hidden;
    }
    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px; border-bottom: 1px solid var(--ocx-border);
      flex-shrink: 0;
    }
    #header-title { font-weight: 600; font-size: 13px; }
    #header-actions { display: flex; gap: 4px; }
    .icon-btn {
      background: none; border: none; color: var(--ocx-fg); cursor: pointer;
      font-size: 16px; padding: 2px 4px; border-radius: 3px; line-height: 1;
    }
    .icon-btn:hover { background: var(--ocx-hover); }
    #workspace-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 8px; font-size: 11px; color: var(--ocx-dim);
      border-bottom: 1px solid var(--ocx-border); flex-shrink: 0;
    }
    .mini-btn {
      padding: 2px 8px; border: 1px solid var(--ocx-border); border-radius: 3px;
      background: var(--ocx-btn-sec-bg); color: var(--ocx-btn-sec-fg);
      cursor: pointer; font-size: 11px; white-space: nowrap;
    }
    .mini-btn:hover { background: var(--ocx-btn-sec-hover); }
    #thread-tabs {
      display: flex; overflow-x: auto; border-bottom: 1px solid var(--ocx-border);
      flex-shrink: 0; scrollbar-width: none;
    }
    #thread-tabs::-webkit-scrollbar { display: none; }
    .tab {
      padding: 6px 10px; cursor: pointer; border-bottom: 2px solid transparent;
      font-size: 12px; white-space: nowrap; flex-shrink: 0;
    }
    .tab:hover { background: var(--ocx-hover); }
    .tab.active { border-bottom-color: var(--ocx-link); }
    #context-bar {
      display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 8px;
      border-bottom: 1px solid var(--ocx-border); flex-shrink: 0;
      min-height: 0;
    }
    #context-bar:empty { display: none; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 6px; border-radius: 3px; font-size: 11px;
      background: var(--ocx-chip-bg); color: var(--ocx-chip-fg);
      cursor: default; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip .chip-close {
      cursor: pointer; font-size: 14px; line-height: 1; opacity: 0.7;
    }
    .chip .chip-close:hover { opacity: 1; }
    .chip.file { border-left: 3px solid var(--ocx-link); }
    .chip.selection { border-left: 3px solid var(--ocx-warn); }
    #chat {
      flex: 1; overflow-y: auto; padding: 8px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .empty-state {
      color: var(--ocx-dim); font-style: italic; text-align: center;
      padding: 24px 8px; font-size: 12px;
    }
    .msg {
      padding: 8px 10px; border-radius: 6px; font-size: 13px;
      line-height: 1.5; word-break: break-word;
    }
    .msg.user {
      background: var(--ocx-btn-sec-bg); color: var(--ocx-btn-sec-fg);
      align-self: flex-end; max-width: 90%;
    }
    .msg.assistant {
      background: transparent; border: 1px solid var(--ocx-border);
    }
    .msg.system {
      color: var(--ocx-dim); font-size: 11px; text-align: center;
      font-style: italic;
    }
    .msg.error {
      color: var(--ocx-err); background: rgba(255,0,0,0.05);
      border: 1px solid var(--ocx-err);
    }
    .msg p { margin: 4px 0; }
    .msg p:first-child { margin-top: 0; }
    .msg p:last-child { margin-bottom: 0; }
    .msg strong { font-weight: 600; }
    .msg em { font-style: italic; }
    .msg ul, .msg ol { padding-left: 20px; margin: 4px 0; }
    .msg li { margin: 2px 0; }
    .msg h1, .msg h2, .msg h3, .msg h4 { margin: 8px 0 4px; font-weight: 600; }
    .msg h1 { font-size: 16px; }
    .msg h2 { font-size: 15px; }
    .msg h3 { font-size: 14px; }
    .msg hr { border: none; border-top: 1px solid var(--ocx-border); margin: 8px 0; }
    .msg blockquote {
      border-left: 3px solid var(--ocx-dim); padding-left: 8px;
      margin: 4px 0; color: var(--ocx-dim);
    }
    .msg a { color: var(--ocx-link); text-decoration: none; }
    .msg a:hover { text-decoration: underline; }
    .code-block {
      margin: 4px 0; border: 1px solid var(--ocx-border);
      border-radius: 4px; overflow: hidden;
    }
    .code-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 8px; background: var(--ocx-tool-bg);
      font-size: 11px; color: var(--ocx-dim);
    }
    .code-actions { display: flex; gap: 4px; }
    .code-actions button {
      background: none; border: none; color: var(--ocx-dim); cursor: pointer;
      font-size: 11px; padding: 2px 6px; border-radius: 2px;
    }
    .code-actions button:hover { color: var(--ocx-fg); background: var(--ocx-hover); }
    .code-body {
      padding: 6px 8px; background: var(--ocx-code-bg);
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 12px; overflow-x: auto; white-space: pre;
      tab-size: 2;
    }
    .tool-step {
      border: 1px solid var(--ocx-border); border-radius: 4px;
      margin: 4px 0; overflow: hidden;
    }
    .tool-step-header {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 8px; cursor: pointer; background: var(--ocx-tool-bg);
      font-size: 12px; user-select: none;
    }
    .tool-step-header:hover { background: var(--ocx-hover); }
    .tool-step-header .tool-icon { font-size: 14px; }
    .tool-step-header .tool-name { font-weight: 500; flex: 1; }
    .tool-step-header .tool-status {
      font-size: 10px; padding: 0 4px; border-radius: 2px;
    }
    .tool-status.running { color: var(--ocx-warn); }
    .tool-status.done { color: var(--ocx-success); }
    .tool-status.error { color: var(--ocx-err); }
    .tool-step.collapsed .tool-body { display: none; }
    .tool-body {
      padding: 4px 8px; font-size: 12px; max-height: 200px; overflow-y: auto;
    }
    .tool-body pre {
      white-space: pre-wrap; font-family: var(--vscode-editor-font-family, monospace);
      font-size: 11px; margin: 0;
    }
    .approval-inline {
      border: 1px solid var(--ocx-warn); border-radius: 4px;
      margin: 4px 0; padding: 8px; background: rgba(204,167,0,0.05);
    }
    .approval-inline .approval-header {
      display: flex; align-items: center; gap: 4px; margin-bottom: 4px;
      font-size: 12px; font-weight: 600;
    }
    .approval-inline .approval-summary { font-size: 12px; color: var(--ocx-dim); }
    .approval-actions {
      display: flex; gap: 6px; margin-top: 6px;
    }
    .approval-actions button {
      padding: 3px 10px; border: none; border-radius: 3px;
      font-size: 11px; cursor: pointer;
    }
    .btn-allow { background: var(--ocx-btn-bg); color: var(--ocx-btn-fg); }
    .btn-allow:hover { background: var(--ocx-btn-hover); }
    .btn-deny {
      background: var(--ocx-btn-sec-bg); color: var(--ocx-btn-sec-fg);
      border: 1px solid var(--ocx-border) !important;
    }
    .btn-deny:hover { background: var(--ocx-btn-sec-hover); }
    .badge-remote {
      font-size: 9px; padding: 0 4px; border-radius: 2px;
      background: #a31515; color: #fff; text-transform: uppercase;
    }
    .plan-indicator {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px; background: rgba(0,120,212,0.1);
      border: 1px solid var(--ocx-link); border-radius: 4px;
      margin: 4px 0; font-size: 12px;
    }
    #composer {
      border-top: 1px solid var(--ocx-border); padding: 6px 8px;
      flex-shrink: 0; display: flex; flex-direction: column; gap: 4px;
    }
    #composer-row {
      display: flex; gap: 4px; align-items: flex-end;
    }
    #prompt-input {
      flex: 1; padding: 6px 8px; border: 1px solid var(--ocx-input-border);
      border-radius: 4px; background: var(--ocx-input-bg);
      color: var(--ocx-input-fg); font-family: inherit; font-size: 13px;
      resize: none; min-height: 28px; max-height: 120px;
    }
    #send-btn {
      padding: 6px 14px; border: none; border-radius: 4px;
      background: var(--ocx-btn-bg); color: var(--ocx-btn-fg);
      cursor: pointer; font-size: 13px; font-weight: 500;
    }
    #send-btn:hover { background: var(--ocx-btn-hover); }
    #send-btn:disabled { opacity: 0.5; cursor: default; }
    #composer-actions {
      display: flex; gap: 4px; align-items: center;
    }
    #composer-actions .mini-btn { font-size: 11px; padding: 2px 6px; }
    #mode-select {
      font-size: 11px; padding: 2px 4px; border: 1px solid var(--ocx-border);
      border-radius: 3px; background: var(--ocx-input-bg); color: var(--ocx-input-fg);
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    .streaming-cursor {
      display: inline-block; width: 8px; height: 14px;
      background: var(--ocx-fg); animation: blink 0.8s infinite;
      vertical-align: middle; margin-left: 2px;
    }
  </style>
</head>
<body>
  <div id="header">
    <span id="header-title">OpenCodex</span>
    <div id="header-actions">
      <button class="icon-btn" title="New Thread" id="btn-new-thread">+</button>
    </div>
  </div>
  <div id="workspace-row">
    <span id="workspace-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">No folder open</span>
    <span id="model-display" style="font-size:10px;color:var(--ocx-dim)"></span>
  </div>
  <div id="thread-tabs"></div>
  <div id="context-bar"></div>
  <div id="chat"><div class="empty-state">Create or select a thread to start</div></div>
  <div id="composer" style="position:relative">
    <div id="mention-dropdown"></div>
    <div id="composer-actions">
      <select id="mode-select">
        <option value="agent">Agent</option>
        <option value="plan">Plan</option>
      </select>
      <button class="mini-btn" id="btn-attach-file" title="Attach active file">+ File</button>
      <button class="mini-btn" id="btn-attach-sel" title="Attach selection">+ Sel</button>
      <button class="mini-btn" id="btn-attach-pick" title="Pick file (@)">@</button>
    </div>
    <div id="composer-row">
      <textarea id="prompt-input" rows="1" placeholder="Ask OpenCodex... (use @ to mention files)"></textarea>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
