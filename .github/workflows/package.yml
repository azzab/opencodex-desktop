      #     node ./scripts/publish-r2.mjs upload --platform mac --dist release-artifacts ...
      #     node ./scripts/publish-r2.mjs upload --platform win --dist release-artifacts ...
      #     node ./scripts/publish-r2.mjs upload --platform linux --dist release-artifacts ...
